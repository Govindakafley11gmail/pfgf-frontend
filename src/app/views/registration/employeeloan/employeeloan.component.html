<div class="modal-body">
  <div class="card-body">
    <form [formGroup]="loanForm">

      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Bank Name *</label>
        <div class="col-sm-4">
          <input type="text" class="form-control" formControlName="bank_name" placeholder="Bank Name..." />
         
        </div>

        <label class="col-sm-2 col-form-label">Loan Account No *</label>
        <div class="col-sm-4">
          <input type="text" class="form-control" formControlName="loan_account_no" placeholder="Loan Account No..." />
         
        </div>
      </div>

      <!-- Loan Status & Sanction Amount -->
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Loan Status *</label>
        <div class="col-sm-4">
          <select class="form-control" formControlName="loan_status">
            <option value="">Select Status</option>
            <option value="Active">Active</option>
            <option value="Closed">Closed</option>
          </select>
         
        </div>

        <label class="col-sm-2 col-form-label">Sanction Amount *</label>
        <div class="col-sm-4">
          <input type="number" class="form-control" formControlName="sanction_amount" placeholder="Sanction Amount..." />
          
        </div>
      </div>

      <!-- Sanction Date -->
      <div class="form-group row">
        <label class="col-sm-2 col-form-label">Sanction Date *</label>
        <div class="col-sm-4">
          <input type="date" class="form-control" formControlName="sanction_date" />
        
        </div>
      </div>

      <!-- Submit Button -->
      <div class="form-group row">
        <div class="col-sm-12 text-end">
          <button type="submit" class="btn btn-primary"*ngIf="isSaved"(click)="onSubmit()">Save Loan</button>
          <button type="submit" class="btn btn-primary"*ngIf="isUpdate"(click)="updateLoan()">Update Loan</button>

        </div>
      </div>

    </form>
  </div>
</div>
<div class="containers shadow bg-white rounded ml-4">
  <div class="cards">
    <div class="card-header my-3">
      <strong>Loan Details</strong>
    </div>

    <div
      class="card-body bg-light"
   
    >
      <table
        class="table table-bordered table-striped rounded table-hover"
      
      >
        <thead style="background-color: #041562 !important; color: #fff !important">
          <tr>
            <th>Sl.No</th>
            <th>Bank Name</th>
            <th>Loan Account No</th>
            <th>Loan Status</th>
            <th>Sanction Amount</th>
            <th>Sanction Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let loan of loanDetails; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ loan.bank_name }}</td>
            <td>{{ loan.loan_account_no }}</td>
            <td>{{ loan.loan_status }}</td>
            <td>{{ loan.sanction_amount }}</td>
            <td>{{ loan.sanction_date | date:'dd-MM-yyyy' }}</td>
            <td class="col-lg-2">
              <button
                class="btn btn-sm mr-2"
                style="background-color: #041562 !important; color: #fff !important"
                (click)="editLoan(loan)"
              >
                Edit
              </button>
             
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
