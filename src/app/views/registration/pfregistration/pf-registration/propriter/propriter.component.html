<div class="modal-body">
  <div class="container">
    <div class="card-body">
      <form [formGroup]="Proprietors">
        
        <div class="form-group row">
          <label for="inputPassword" class="col-sm-2 col-form-label"
            >Name *</label
          >
          <div class="col-sm-4">
            <input
              type="text"
              formControlName="proprietor_name"
              
              class="form-control"
              placeholder="Name Of Proprietors ..."
            />
            <!-- <span
              class="text-danger"
              *ngIf="
                (registerFormControl.proprietor_name.touched || submitted) &&
                registerFormControl.proprietor_name.errors?.required
              "
            >
              Proprietor name is required
            </span> -->
          </div>
          <label for="inputPassword" class="col-sm-2 col-form-label"
            >Contact No *</label
          >
          <div class="col-sm-4">
            <input
              type="text"
              formControlName="contact_number"
             
              class="form-control"
              placeholder="Contact Number ..."
            />
            <!-- <span
              class="text-danger"
              *ngIf="
                (registerFormControl.contact_number.touched || submitted) &&
                registerFormControl.contact_number.errors?.required
              "
            >
              Contact number is required
            </span> -->
          </div>
        </div>

        <div class="form-group row">
          <label for="inputPassword" class="col-sm-2 col-form-label"
            >Email
          </label>
          <div class="col-sm-4">
            <input
              type="email"
              formControlName="email_id"
              class="form-control"
              placeholder="Email Id"
            />
          </div>
          <label for="inputPassword" class="col-sm-2 col-form-label"
            >Address *</label
          >
          <div class="col-sm-4">
            <input
              type="text"
              formControlName="address"
              
              class="form-control"
              placeholder="Address..."
            />
           
          </div>
        </div>

        <div class="form-group row">
          <label for="inputPassword" class="col-sm-2 col-form-label"
            >Designation
          </label>
          <div class="col-sm-4">
            <input
              type="text"
              formControlName="designation"
              
              class="form-control"
              placeholder="Designation..."
            />
           
          </div>
        
        </div>
        <div class="form-group row">
          <label for="inputPassword" class="col-sm-2 col-form-label"
            >Emp.Detail
          </label>
          <div class="col-sm-10">
            <textarea
              type="text"
              formControlName="employee_detail"
             
              class="form-control"
              placeholder="employee detail"
            ></textarea>
            
          </div>
        </div>
      </form>
      
    </div>
  </div>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-primary"
    (click)="createPropriter()"
    style="background-color: #041562 !important; color: #fff !important"
  >
    Save
  </button>
  <button
    type="button"
    class="btn btn-primary"
    (click)="updatePropriteById()"
    style="background-color: #041562 !important; color: #fff !important"
  >
    Update
  </button>
</div>

<div class="containers">
  <div class="cards">
    <div class="card-header">
      <strong>Proprietors Details</strong>
      <div class="card-header-actions">
        <small
          className="text-muted "
          style="background-color: #041562 !important; color: #fff !important"
          class="btn bg-primary rounded-circle"
          (click)="isCollapsed = !isCollapsed"
        >
          <i class="fa fa-angle-double-down"></i>
        </small>

        <small
          className="text-muted"
          style="background-color: #041562 !important; color: #fff !important"
          class="btn mr-1 bg-primary rounded-circle"
          data-toggle="modal"
          (click)="create()"
        >
          <i class="fa fa-plus"></i>
        </small>
      </div>
    </div>
    <div
      class="card-body bg-light"
      (collapsed)="collapsed($event)"
      (expanded)="expanded($event)"
      [collapse]="isCollapsed"
    >
      <table
        class="table table-bordered table-striped rounded table-hover"
        datatable
        [dtOptions]="dtOptions"
        [dtTrigger]="dtTrigger"
      >
        <thead
          style="background-color: #041562 !important; color: #fff !important"
        >
          <tr>
            <th>Sl.No</th>
            <th>ProprietorsName</th>
            <th>ContactNo</th>
            <th>EmailId</th>
            <th>Address</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let listPropriters of listPropriter; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ listPropriters.proprietor_name }}</td>
            <td>{{ listPropriters.contact_number }}</td>
            <td>{{ listPropriters.email_id }}</td>
            <td>{{ listPropriters.address }}</td>
            <td>{{ listPropriters.status }}</td>

            <td class="col-lg-2">
              <span
                class="btn btn-success btn-sm mr-2"
                (click)="getPropriterDetailsById(listPropriters.id)"
                >Edit
              </span>
              <span
                class="btn btn-danger btn-sm"
                (click)="show(listPropriters.id)"
                >Delete</span
              >
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
