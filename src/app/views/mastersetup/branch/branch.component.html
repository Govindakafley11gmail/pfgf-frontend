<div bsModal #myModal="bs-modal" [config]="{backdrop: 'static',  keyboard: false}" class="modal fade " tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
  aria-hidden="true">
  <div class="modal-dialog  " role="document">
    <div class="modal-content">
      <div class="modal-header" style="background-color: #041562!important;color:#fff!important;">
        <h6 class="modal-title">Branch Name</h6>
        <button type="button" class="btn btn-primary" (click)="myModal.hide()" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">


        <div class="containers">
          <form [formGroup]="createbranchs">
            <div class="form-group row">
              <input type="hidden" class="form-control" placeholder="branch_id" formControlName="branch_id">

              <label for="inputPassword" class="col-sm-4 col-form-label">Branch Name*</label>
              <div class="col-sm-8">
                <input type="text" class="form-control" placeholder="Branch Name" formControlName="branch_name">
              </div>
            </div>
            <div class="form-group row">
              <label for="inputPassword" class="col-sm-4 col-form-label">Location *</label>
              <div class="col-sm-8">
                <input type="text" class="form-control" placeholder="branch location" formControlName="branch_location">
              </div>
            </div>
            <div class="form-group row">
              <label for="inputPassword" class="col-sm-4 col-form-label">Code *&nbsp;<i class="fa fa-qrcode" aria-hidden="true"></i>
              </label>
              <div class="col-sm-8">
                <input type="text" class="form-control"  placeholder="branch code"
                  formControlName="branch_code">
              </div>
            </div>

          </form>
          <div id="pause"*ngIf="isLoading" class="d-flex align-items-center justify-content-center">
            <div id="spinner"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">Close</button>
        <button type="button" class="btn btn-primary" (click)="createBranch()" [disabled]="createbranchs.invalid"
          *ngIf="save" style="background-color: #041562!important;color:#fff!important;"><i class="fa fa-check-square-o" aria-hidden="true"></i>&nbsp;Save</button>
        <button type="button" class="btn btn-primary" (click)="updateBranch()" *ngIf="update"
          style="background-color: #041562!important;color:#fff!important;">Update</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<div class="containers my-4  ml-4">
  <div class="animated fadeIn">
    <div class="row">
      <div class="col-lg-12">
        <div class="card">
          <div class="card-header bg-white">
            Master Setup  <i class="fa fa-arrow-circle-o-right" aria-hidden="true"></i>Branch List
            <button type="button" class="btn btn-primary mr-1 pull-right"
              style="background-color: #041562!important;color:#fff!important;"*ngIf="branchcreate" data-toggle="modal" (click)="create()">
              <i class="fa fa-plus-square-o" aria-hidden="true"></i>&nbsp; Add Branch
            </button>
          </div>
          <div class="card-body my-3">
            <table class="table table-bordered table-striped rounded table-hover" datatable [dtOptions]="dtOptions"
              [dtTrigger]="dtTrigger">
              <thead style="background-color: #041562!important;color:#fff!important;">
                <tr class="text-center">
                  <th>Sl.No</th>
                  <th>Branch Name</th>
                  <th>Code &nbsp; <i class="fa fa-qrcode" aria-hidden="true"></i></th>
                  <th>Location</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let listBranchtvalue of getBranchList">
                  <td class="">{{listBranchtvalue.id}}</td>
                  <td class="">{{listBranchtvalue.branch_name}}</td>
                  <td class="">{{listBranchtvalue.branch_code}}</td>
                  <td class="">{{listBranchtvalue.branch_location}}</td>
                  <td class="col-lg-2">
                    <button class="btn btn-sm btn-success" (click)="editBranch(listBranchtvalue.id)"*ngIf="branchEdit"><i class="fa fa-pencil-square-o" aria-hidden="true"></i>&nbsp;Edit </button>
                    <button class="btn btn-sm btn-danger" (click)="show(listBranchtvalue.id)"*ngIf="branchDelete"><i class="fa fa-minus-square-o" aria-hidden="true"></i>&nbsp;Delete</button>
                    <i class="fa fa-lock"*ngIf="!branchEdit">&nbsp; List only</i>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <!--/.col-->
    </div>
  </div>
</div>

<!-- --------------------confirmation------------------- -->

<div bsModal #myModals="bs-modal" [config]="{backdrop: 'static',  keyboard: false}" class="modal fade " tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
  aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header bg-danger">
        <h4 class="modal-title">Confirmation</h4>
        <button type="button" class="close" (click)="myModals.hide()" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <h5 class="ml-4 mt-2">Are you sure to delete?</h5>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="myModals.hide()">No</button>
        <button type="button" class="btn btn-danger" (click)="deleteBranch(ids)">Yes</button>
      </div>
    </div>
  </div>
</div>
<div id="pause"*ngIf="isLoading" class="d-flex align-items-center justify-content-center">
  <div id="spinner"></div>
</div>
<!-- ------------------end --------------------confirmation------------------- -->
