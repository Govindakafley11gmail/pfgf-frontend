<div bsModal #myModal="bs-modal" [config]="{backdrop: 'static',  keyboard: false}" class="modal fade " tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
  aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header"style="background-color: #041562!important;color:#fff!important;">
        <h6 class="modal-title">Permission</h6>
        <button type="button"class="btn btn-primary" (click)="myModal.hide()" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body" [formGroup]="createPermission">
        <div class="row">
          <p><input type="hidden" class="form-control"  placeholder="" formControlName="id"></p>
          
          <div class="col-md-12">
            <input type="text" class="form-control"  placeholder="Permission Name"
              formControlName="permission_name">
            <span class="text-danger"
              *ngIf="(registerFormControl.permission_name.touched || submitted) && registerFormControl.permission_name.errors?.required">
              permission Name is required
            </span>
          </div>
          <p><input type="hidden" class="form-control" placeholder="Guard_name"value="{{api}}"
              formControlName="guard_name"></p>
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="myModal.hide()">Close</button>
        <button type="button" class="btn btn-primary" *ngIf="save" 
          (click)="createPermissions()"style="background-color: #041562!important;color:#fff!important;">Save</button>
        <button type="button" class="btn btn-primary" *ngIf="update" 
          (click)="updatePermission()"style="background-color: #041562!important;color:#fff!important;"><i class="fa fa-check-square-o" aria-hidden="true"></i> Update</button>

      </div>
    </div>
  </div>
</div>

<!-- --------------------confirmation------------------- -->

<div bsModal #myModals="bs-modal" [config]="{backdrop: 'static',  keyboard: false}" class="modal fade " tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
  aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header bg-danger">
        <h4 class="modal-title">Confirmation</h4>
        <button type="button" class="close" (click)="myModals.hide()" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <h5 class="ml-4 mt-2">Are you sure to delete?</h5>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">No</button>
        <button type="button" class="btn btn-danger" (click)="deletePermission(ids)">Yes</button>
      </div>
    </div>
  </div>
</div>
<!-- ------------------end --------------------confirmation------------------- -->

<div class="containers">
  <div class="animated fadeIn">
    <div class="row my-4">
      <div class="col-lg-12">
        <div class="card shadow-sm bg-white rounded ml-4">
          <div class="card-header bg-white" >
            Access Management  <i class="fa fa-arrow-circle-o-right" aria-hidden="true"></i>User Permissions
            <button type="button" class="btn btn-primary mr-1 pull-right"*ngIf="permissioncreate" data-toggle="modal" (click)="showPermission()"style="background-color: #041562!important;color:#fff!important;">
              <i class="fa fa-plus-square-o" aria-hidden="true"></i> &nbsp;Add Permission
            </button>
          </div>
          <div class="card-body my-2">
            <table class="table table-bordered table-striped table-hover" datatable [dtOptions]="dtOptions"
              [dtTrigger]="dtTrigger">
              <thead style="background-color: #041562!important;color:#fff!important;">
                <tr>
                  <td>Sl.No</td>
                  <td>Permission Name</td>
                  <td>Action</td>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let listPermissions of listPermissions;let i = index">
                  <td>{{i+1}}</td>
                  <td>{{listPermissions.name}}</td>
                  <td class="col-lg-2"*ngIf="permissionedit">
                    <button class="btn btn-success mr-2" (click)="editPermission(listPermissions.id)"*ngIf="permissionedit"><i class="fa fa-pencil-square-o" aria-hidden="true"></i>&nbsp;Edit </button>
                    <button class="btn btn-danger " (click)="show(listPermissions.id)"*ngIf="permissiondelete">
                      <i class="fa fa-minus-square-o" aria-hidden="true"></i>&nbsp;Delete</button>
                  </td>
                <td *ngIf="!permissionedit">
                    <i class="fa fa-lock">&nbsp; List only</i>
                </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <!--/.col-->
    </div>
  </div>
</div>

<table mat-table [dataSource]="dataSource" matSort>

  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
  </ng-container>

  <!-- Guard Name Column -->
  <ng-container matColumnDef="guard_name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Guard Name</th>
    <td mat-cell *matCellDef="let element">{{ element.guard_name }}</td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let element">
      <!-- Your action buttons here -->
    </td>
  </ng-container>

  <!-- Header & Row Declarations -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

</table>

<!-- Material Paginator -->
<mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>



<div id="pause"*ngIf="isLoading" class="d-flex align-items-center justify-content-center">
  <div id="spinner"></div>
</div>
