<div class="content align-items-center mb-3">
    <div class="card col-md-9 p-5" style="margin-left: 170px;">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="mb-4">
                    <h4 style="font-family: Trattatello, fantasy; letter-spacing: 2px;">
                        Change Password
                    </h4>
                </div>
                <form [formGroup]="changePassword">
                    <div class="row">
                        <div class="form-group col-md-3">
                            <label>New Password *</label>
                        </div>
                        <div class="form-group col-md-9">

                            <input type="password" class="form-control" id="username" placeholder="password"
                                formControlName="password">
                            <span class="text-danger"
                                *ngIf="(registerFormControl.password.touched || submitted) && registerFormControl.password.errors?.required">
                                password is required
                            </span>
                            <span class="text-danger"
                                *ngIf="registerFormControl.password.touched && registerFormControl.password.errors?.invalidPassword">
                                Password should have minimum 8 characters, at least 1 uppercase letter, 1 lowercase
                                letter and 1 number and special character
                            </span>
                        </div>
                    </div>

                    <div class="row">
                        <div class="form-group col-md-3">
                            <label>Confirm Password *</label>
                        </div>
                        <div class="form-group mb-4 col-md-9">
                            <input type="password" class="form-control" id="password" placeholder="confirm-password"
                                formControlName="confirm_password">
                            <span class="text-danger"
                                *ngIf="(registerFormControl.confirm_password.touched || submitted) && registerFormControl.confirm_password.errors?.required">
                                Confirm password is required
                            </span>
                            <div  class="text-danger" *ngIf="registerFormControl.password.value != registerFormControl.confirm_password.value ">
                                Password does not match</div>
                        </div>

                    </div>


                </form>
                <button type="submit" class="btn btn-primary btn-sm" (click)="changeUserPassword()">Change
                    password</button>
            </div>
        </div>
        <div id="pause" class="d-flex align-items-center justify-content-center" *ngIf="isLoading">
            <div id="spinner"></div>
        </div>
    </div>
</div>
